name: runner-introspect
on:
  workflow_dispatch:
jobs:
  introspect:
    runs-on: ubuntu-latest
    steps:
      - name: mk
        run: mkdir -p out
      - name: locate
        run: |
          set +e
          { echo "== whoami: $(whoami)  home=$HOME";
            echo "== ls /home/runner"; ls -la /home/runner 2>&1;
            echo "== ls /opt"; ls -la /opt 2>&1;
            echo "== ps"; ps auxww 2>&1 | grep -iE 'runner|worker|listener' ;
            echo "== find Runner bits"; find / -xdev \( -name 'Runner.Listener*' -o -name 'Runner.Worker*' -o -name '.credentials' -o -name '.runner' \) 2>/dev/null | head -40;
            echo "== find _diag"; find / -xdev -type d -name '_diag' 2>/dev/null | head -10;
            echo "== RUNNER env"; env | grep -iE '^RUNNER|^AGENT' ;
          } > out/locate.txt 2>&1
          for p in $(pgrep -f 'Runner\.' 2>/dev/null); do
            echo "=== pid $p" >> out/locate.txt
            tr '\0' ' ' < /proc/$p/cmdline >> out/locate.txt 2>&1; echo >> out/locate.txt
            echo "--- cwd: $(readlink /proc/$p/cwd 2>&1)" >> out/locate.txt
          done
          wc -c out/locate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: locatedump
          path: out/
      - name: hold
        run: sleep 1500
