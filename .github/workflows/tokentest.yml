name: tokentest
on:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe-base-writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          B=johngandour/test
          {
            echo "== token permissions header =="
            curl -s -o /dev/null -D - -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/$B | grep -i "x-accepted-github-permissions\|x-oauth-scopes" || true
            echo "== WRITE ATTEMPT 1: create issue on BASE =="
            curl -s -o r1.json -w "http=%{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/$B/issues -d '{"title":"FORKTOKEN-WRITE-PROBE","body":"probe"}'
            head -c 200 r1.json; echo
            echo "== WRITE ATTEMPT 2: create branch ref on BASE =="
            SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/$B/git/ref/heads/main | python3 -c "import json,sys;print(json.load(sys.stdin)['object']['sha'])")
            curl -s -o r2.json -w "http=%{http_code}\n" -X POST -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/$B/git/refs -d "{\"ref\":\"refs/heads/forktoken-probe\",\"sha\":\"$SHA\"}"
            head -c 200 r2.json; echo
            echo "== WRITE ATTEMPT 3: create file on BASE =="
            curl -s -o r3.json -w "http=%{http_code}\n" -X PUT -H "Authorization: Bearer $GH_TOKEN" \
              https://api.github.com/repos/$B/contents/FORKTOKEN.md -d '{"message":"probe","content":"cHJvYmU="}'
            head -c 200 r3.json; echo
            echo "== READ (control): base repo metadata =="
            curl -s -o /dev/null -w "http=%{http_code}\n" -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/$B
          } > out/res.txt 2>&1
          cat out/res.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tokres
          path: out/
